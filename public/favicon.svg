<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="candy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="wrap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fda4af"/>
      <stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1e3a8a" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="90" cy="90" r="120" fill="#fff" opacity=".12"/>
  <circle cx="440" cy="430" r="150" fill="#fff" opacity=".10"/>
  <g filter="url(#sh)">
    <!-- wrapper left -->
    <path d="M118 196 L52 150 Q40 142 44 160 L66 214 Q40 236 44 258 Q40 280 66 298 L44 352 Q40 370 52 362 L118 316 Z" fill="url(#wrap)"/>
    <!-- wrapper right -->
    <path d="M394 196 L460 150 Q472 142 468 160 L446 214 Q472 236 468 258 Q472 280 446 298 L468 352 Q472 370 460 362 L394 316 Z" fill="url(#wrap)"/>
    <!-- candy body -->
    <ellipse cx="256" cy="256" rx="148" ry="104" fill="url(#candy)"/>
    <ellipse cx="256" cy="256" rx="148" ry="104" fill="none" stroke="#fb7185" stroke-width="10"/>
    <path d="M146 214 Q176 168 236 160" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" opacity=".9"/>
  </g>
  <!-- BB monogram -->
  <text x="256" y="292" text-anchor="middle" font-family="'Trebuchet MS','Arial Rounded MT Bold',Verdana,sans-serif" font-weight="900" font-size="112" fill="#2563eb" letter-spacing="-4">BB</text>
  <!-- sparkles -->
  <path d="M410 86 l8 22 22 8 -22 8 -8 22 -8 -22 -22 -8 22 -8z" fill="#fff"/>
  <path d="M72 352 l5 14 14 5 -14 5 -5 14 -5 -14 -14 -5 14 -5z" fill="#fff" opacity=".9"/>
  <!-- wordmark -->
  <text x="256" y="448" text-anchor="middle" font-family="'Trebuchet MS','Arial Rounded MT Bold',Verdana,sans-serif" font-weight="900" font-size="62" fill="url(#word)" stroke="#1e3a8a" stroke-opacity=".35" stroke-width="2" paint-order="stroke" letter-spacing="1">Bon-Bon</text>
</svg>
